name: runner-smoke

# Manual sanity check that the self-hosted runner picks up jobs and can drive
# Docker (the reusable workflows run their steps inside containers). Trigger with
# `gh workflow run runner-smoke.yml --repo x-farmer/.github`.

on:
  workflow_dispatch: {}

jobs:
  host:
    runs-on: [self-hosted, linux, x64, tainan-node05]
    steps:
      - name: Identify runner
        run: |
          echo "host=$(hostname) user=$(whoami)"
          uname -a
      - name: Docker access
        run: |
          docker version
          docker run --rm hello-world

  container:
    needs: host
    runs-on: [self-hosted, linux, x64, tainan-node05]
    container:
      image: node:22-bookworm
    steps:
      - run: node --version && npm --version
