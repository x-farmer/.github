name: ghcr-probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: [self-hosted, linux, x64, tainan-node05]
    steps:
      - name: probe ghcr
        env:
          GHCR: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "secret_present=${{ secrets.GHCR_TOKEN != '' }} len=${#GHCR}"
          if [ -z "$GHCR" ]; then echo "NO SECRET"; exit 3; fi
          echo "$GHCR" | docker login ghcr.io -u maple52046 --password-stdin
          docker pull alpine:3 >/dev/null
          docker tag alpine:3 ghcr.io/x-farmer/ci-probe:1
          docker push ghcr.io/x-farmer/ci-probe:1
