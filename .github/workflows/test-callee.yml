name: test-callee
on:
  workflow_call:
    inputs:
      push-image:
        type: boolean
        default: false
jobs:
  probe:
    runs-on: [self-hosted, linux, x64, tainan-node05]
    steps:
      - run: echo probe
  image:
    if: >-
      inputs.push-image &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: probe
    runs-on: [self-hosted, linux, x64, tainan-node05]
    steps:
      - run: echo image-job-parsed
